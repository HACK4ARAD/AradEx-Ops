services:
  db:
    image: postgres:16-alpine
    container_name: aradexperience-db
    environment:
      POSTGRES_DB: aradexperience
      POSTGRES_USER: arad
      POSTGRES_PASSWORD: arad
    ports:
      - "5432:5432"
    volumes:
      - aradexperience_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arad -d aradexperience"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aradexperience_pg:
