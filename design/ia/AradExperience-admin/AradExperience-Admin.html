<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AradExperience Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F3;--surf:#FFFFFF;--ink:#111113;--mut:#6E6E73;--line:#E8E7E2;--soft:#F1F0EC;--side:#0E0E10;--side2:#1B1B1F;--sidetx:#A1A1A8;--acc:#FF5A36;--ok:#2F7D32;--okbg:#E5F2E3;--warn:#8A5A00;--warnbg:#FBF0D9;--bad:#B3261E;--badbg:#FCE8E6;--info:#1D5FD1;--infobg:#E6EEFC;--r:14px;--shadow:0 1px 2px rgba(16,16,20,.05),0 2px 10px rgba(16,16,20,.04)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-variation-settings:'wght' 400;font-size:20px;vertical-align:middle}
.msf{font-variation-settings:'FILL' 1,'wght' 500}
/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff}
.brand b{font-size:15px;letter-spacing:-.01em}.brand small{display:block;font-size:11px;color:var(--sidetx);font-weight:500}
.orgsw{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side2);margin:0 0 14px}
.orgsw .av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.orgsw b{display:block;font-size:13px}.orgsw span{font-size:11.5px;color:var(--sidetx)}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6B6B72;padding:14px 12px 6px}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:none;border-radius:10px;background:none;text-align:left;font-weight:500;color:var(--sidetx);font-size:13.5px}
.nav:hover{background:var(--side2);color:#fff}
.nav.on{background:var(--side2);color:#fff}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav .ms{font-size:19px}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border-top:1px solid #222;margin-top:8px}
.me .av{width:32px;height:32px;border-radius:50%;background:#2A2A30;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.me b{display:block;font-size:13px}.me span{font-size:11.5px;color:var(--sidetx)}
.me button{margin-left:auto;background:none;border:none;color:var(--sidetx);padding:6px;border-radius:8px}.me button:hover{background:var(--side2);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(246,246,243,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;white-space:nowrap}.crumbs b{color:var(--ink);font-weight:600}
.search{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:var(--surf);border:1px solid var(--line);color:var(--mut)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--ink)}
.search kbd{font:600 11px Inter;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surf);display:flex;align-items:center;justify-content:center}
.iconbtn i{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--surf)}
.content{padding:24px 28px 56px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.head h1{margin:0;font-size:24px;letter-spacing:-.025em}
.head .sub{color:var(--mut);margin-top:4px;font-size:13.5px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surf);font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#D3D2CC;background:#FCFCFB}
.btn .ms{font-size:18px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:#26262A}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center}
/* cards, kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;display:flex;flex-direction:column;gap:4px}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}.kpi .l .ms{font-size:17px}
.kpi .v{display:flex;align-items:baseline;gap:8px;font-size:26px;font-weight:700;letter-spacing:-.03em}
.delta{font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--okbg);color:var(--ok);letter-spacing:0}
.kpi svg{display:block;width:100%;height:34px;margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flush{padding:0;overflow-x:auto}
td .tt{white-space:nowrap}
a.nav{text-decoration:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{margin:0;font-size:14.5px;letter-spacing:-.01em}.ch .hint{color:var(--mut);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--soft)}
.seg button{height:28px;padding:0 10px;border:none;border-radius:8px;background:transparent;font-weight:600;font-size:12.5px;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{margin-left:auto;color:var(--mut);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFBFA;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:#FBFBFA}
tr:last-child td{border-bottom:none}
.tcell{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:40px;height:40px;border-radius:10px;flex:none;background:#ccc center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800}
.tt{font-weight:600}.ts{font-size:12.5px;color:var(--mut);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mut{background:var(--soft);color:var(--mut)}.p-ink{background:var(--ink);color:#fff}.p-info{background:var(--infobg);color:var(--info)}
.chip{display:flex;width:max-content;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink);margin:2px 0;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px}
code{font:600 12px "IBM Plex Mono",ui-monospace,Consolas,monospace;padding:2px 6px;border-radius:6px;background:var(--soft);white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.avatar.dark{background:var(--ink);color:#fff}
.empty{padding:36px;text-align:center;color:var(--mut)}
.empty .ms{font-size:34px;color:#C9C8C2;display:block;margin:0 auto 8px}
/* forms */
.form{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.fcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:18px}
.fsec{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:600;font-size:13px}
.f .h{font-size:12.5px;color:var(--mut)}
.in{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf);padding:0 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,19,.08)}
.in.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.1)}
.err-t{font-size:12.5px;color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fseg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.fseg button{flex:1;height:32px;border:none;border-radius:8px;background:transparent;font-weight:600;color:var(--mut);font-size:13px}
.fseg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);text-align:left}
.check.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.check .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid #C9C8C2;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.check.on .bx{background:var(--ink);border-color:var(--ink)}
.swatches{display:flex;gap:8px}.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surf);width:100%;text-align:left}
.sw2{width:38px;height:22px;border-radius:999px;background:#D7D6D0;position:relative;flex:none;transition:background .15s}.sw2::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .sw2{background:var(--ok)}.toggle.on .sw2::after{left:19px}
.drop{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed #D3D2CC;border-radius:12px;background:#FBFBFA}
.drop .pv{width:80px;height:56px;border-radius:9px;background:#E8E7E2 center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#A8A7A1}
.actions{display:flex;gap:10px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--line)}
.phone{position:sticky;top:84px;background:#0A0A0A;border-radius:38px;padding:9px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.screen{background:#F7F6F2;border-radius:30px;padding:18px 14px 22px;min-height:440px;display:flex;flex-direction:column;gap:12px}
.screen .cap{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;text-align:center}
.pcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pimg{position:relative;height:150px;background:#8A6A4F center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:50px}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.pchip{position:absolute;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px}
.datechip{position:absolute;left:12px;top:12px;width:52px;padding:6px 0;border-radius:13px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.datechip b{font-size:22px;line-height:1}.datechip span{font-size:10px;font-weight:800;color:#5C5C5C}
.vcard{background:#111;color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
/* split panes */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:560px}
.split .l{border-right:1px solid var(--line);display:flex;flex-direction:column}
.litem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;border-bottom:1px solid var(--line);background:var(--surf);text-align:left}
.litem:hover{background:#FBFBFA}.litem.on{background:var(--soft)}
.litem .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.thread{display:flex;flex-direction:column;min-height:560px}
.thread .hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;background:#FBFBFA;overflow-y:auto;max-height:520px}
.bub{max-width:70%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:14px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.us{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.bt{font-size:11px;color:var(--mut);margin-top:2px}.bt.us{align-self:flex-end}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.vitem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;border-bottom:1px solid var(--line);background:var(--surf);text-align:left}
.vitem.on{background:var(--soft)}.vitem:hover{background:#FBFBFA}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:50;animation:tp .2s ease;max-width:90vw}
@keyframes tp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 140px 46px;gap:12px;align-items:center;font-size:13px}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.feed div:last-child{border-bottom:none}
.feed .fi{width:28px;height:28px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}.feed .fi .ms{font-size:16px}
.stars{color:var(--acc);letter-spacing:1px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--okbg);color:#1F5A22;margin-bottom:16px;border:1px solid #CFE6CB}
.banner code{background:#fff}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.lside{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lside::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,54,.35),transparent 65%)}
.lside h1{font-size:40px;line-height:1.08;letter-spacing:-.035em;margin:0 0 14px;max-width:460px}
.lside p{color:var(--sidetx);line-height:1.6;max-width:440px;margin:0}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px}
.lstats div{background:var(--side2);border-radius:14px;padding:14px}.lstats b{display:block;font-size:22px}.lstats span{font-size:12px;color:var(--sidetx)}
.lmain{display:flex;align-items:center;justify-content:center;padding:40px}
.lbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.lbox h2{margin:0;font-size:24px;letter-spacing:-.02em}.lbox>p{margin:0 0 6px;color:var(--mut)}
.acct{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left}
.acct .top{display:flex;align-items:center;gap:12px}
.acct .ic{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.acct h3{margin:0;font-size:16px}.acct .d{color:var(--mut);font-size:13px;margin-top:2px}
.lnote{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--mut);font-size:12.5px;line-height:1.5}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.form{grid-template-columns:1fr}.phone{position:static;max-width:350px}.split{grid-template-columns:1fr}.split .l{border-right:none;border-bottom:1px solid var(--line)}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.side{position:static;height:auto}.content{padding:18px 16px 40px}.topbar{padding:10px 16px}.search{display:none}.login{grid-template-columns:1fr}.lside{display:none}.two,.three,.checks{grid-template-columns:1fr}.hbar{grid-template-columns:1fr 90px 40px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const ADMK='aradx_admin_v1',PROTOK='aradx_proto_v1',UIK='aradx_admin_ui';
const APP_LINK='../AradExperience-prototype/AradExperience.html';
const TODAY='2026-11-04';
const VEN={pc:'Palatul Cultural',tc:'Teatrul Clasic „Ioan Slavici”',ca:'Cetatea Aradului',fm:'Faleza Mureș'};
const VDIST={pc:'0,3 km',tc:'0,4 km',fm:'0,5 km',ca:'1,2 km'};
const CATS={music:'Concerte',theatre:'Teatru și film',family:'Familie și copii',exhibitions:'Expoziții',sport:'Sport',outdoors:'În aer liber',fairs:'Târguri'};
const CTONE={music:'#7E3A3A',theatre:'#634A72',family:'#A86F58',exhibitions:'#857D71',sport:'#557F7D',outdoors:'#6F8062',fairs:'#B08350'};
const CEM={music:'🎻',theatre:'🎭',family:'🧸',exhibitions:'🖼️',sport:'🏃',outdoors:'🌳',fairs:'🧺'};
const ZONES={centru:'Centru',faleza:'Faleza Mureșului',teatru:'Zona Teatrului',cetate:'Zona Cetății',gara:'Zona Gării'};
const FTYPES=['Cafenea','Restaurant','Brutărie','Magazin','Producător local','Cramă · producător local','Servicii','Altceva'];
const TONES=['#8A6A4F','#A86F58','#5E6B4A','#6E2F3A','#3F6F78','#5C6B73','#634A72','#B08350'];

  const groups=city?[['General',[['dash','space_dashboard','Panou'],['events','event','Evenimente']]],['Comunitate',[['comm','volunteer_activism','Acțiuni comunitare'],['val','fact_check','Validare',totalPending()],['vols','badge','Voluntari'],['msgs','forum','Mesaje',totalUnread()],['board','military_tech','Clasament']]],['Parteneri',[['firms','storefront','Firme partenere']]]]
    :[['Firma ta',[['dash','space_dashboard','Panou'],['offers','sell','Oferte și evenimente'],['reviews','reviews','Recenzii']]]];
  const isOn=k=>UI.view===k||(UI.view==='evNew'&&k==='events')||(UI.view==='volEdit'&&k==='vols')||(UI.view==='commNew'&&k==='comm')||(UI.view==='volNew'&&k==='vols')||(UI.view==='firmNew'&&k==='firms')||(UI.view==='ofNew'&&k==='offers');
  const formLike=!!FORMS[UI.view];
  return `<div class="layout"><aside class="side"><div class="brand"><span class="logo">${ms('location_city',true)}</span><span><b>AradExperience</b><small>Admin</small></span></div>
    <div class="orgsw"><span class="av" style="background:${city?'#2A2A30':F.tone}">${city?ms('account_balance',true):ini(F.name)}</span><span style="min-width:0"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${city?'Primăria Arad':esc(F.name)}</b><span>${city?'Administrator complet':'Firmă parteneră'}</span></span></div>
    ${groups.map(([g,its])=>`<div class="grp">${g}</div>${its.map(([k,ic,l,c])=>`<button class="nav${isOn(k)?' on':''}" data-go="${k}">${ms(ic)}${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}`).join('')}
    <div class="grow"></div><a class="nav" href="${APP_LINK}" target="_blank" rel="noopener">${ms('smartphone')}Deschide aplicația${ms('north_east')}</a>
    <div class="me"><span class="av">${city?'IM':ini(F.contact||F.name)}</span><span style="min-width:0"><b>${city?'Ioana Marin':esc(F.contact||'Administrator')}</b><span>${city?'Coordonator':'Administrator firmă'}</span></span><button data-act="logout" title="Schimbă contul" aria-label="Schimbă contul">${ms('logout')}</button></div></aside>
  <div class="main"><div class="topbar"><div class="crumbs">${o.crumbs.map((c,i)=>i===o.crumbs.length-1?`<b>${esc(c)}</b>`:esc(c)+' '+ms('chevron_right')).join(' ')}</div>
    ${formLike?'<span style="margin-left:auto"></span>':`<label class="search">${ms('search')}<input id="q" placeholder="Caută în pagina asta…" value="${esc(UI.q)}" autocomplete="off"><kbd>/</kbd></label>`}
    <button class="iconbtn" data-go="${city?'msgs':'reviews'}" aria-label="Notificări">${ms('notifications')}${city&&totalUnread()?'<i></i>':''}</button></div>
  <div class="content"><div class="head"><div><h1>${o.title}</h1>${o.sub?`<div class="sub">${o.sub}</div>`:''}</div><div class="row">${o.actions||''}</div></div><div id="body">${o.body}</div></div></div></div>`;}
function current(){const city=UI.acct==='city',v=UI.view;
  if(FORMS[v]&&((city&&v!=='ofNew')||(!city&&v==='ofNew')))return vForm(v);
  if(city)return ({events:V.events,comm:V.comm,val:V.val,vols:V.vols,msgs:V.msgs,board:V.board,firms:V.firms}[v]||V.cityDash)();
  return ({offers:V.offers,reviews:V.reviews}[v]||V.firmDash)();}
function render(){const app=document.getElementById('app');if(!UI.acct){app.innerHTML=vLogin();return;}app.innerHTML=shell(current());const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}
function renderBody(){const b=document.getElementById('body');if(b)b.innerHTML=current().body;}
const upPreview=()=>{const F=FORMS[UI.view];const pv=document.getElementById('pv');if(F&&pv)pv.innerHTML=F.preview(draft);};

// ---------------------------------------------------------------- events
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,Object.assign({},g.dataset.sel?{valSel:g.dataset.sel}:{},g.dataset.thread?{thread:g.dataset.thread}:{}));return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='login'){UI.acct=b.dataset.acct;if(UI.acct==='firm'){const s=document.getElementById('firm-sel');if(s)UI.firm=s.value;}UI.view='dash';UI.flash=null;saveUI();P=rd(PROTOK,{});render();return;}
  if(a==='logout'){UI.acct=null;draft=null;saveUI();render();return;}
  if(a==='filter'){UI.filter=b.dataset.v;saveUI();renderBody();return;}
  if(a==='set'){let v=b.dataset.v;if(b.dataset.k==='paid'||b.dataset.k==='local'||b.dataset.k==='oneTime')v=v==='1';else if(b.dataset.k==='pts')v=+v;draft[b.dataset.k]=v;render();return;}
  if(a==='tog'){const k=b.dataset.k,v=b.dataset.v;draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v];render();return;}
  if(a==='rmImg'){draft.img=null;render();return;}
  if(a==='unflash'){UI.flash=null;saveUI();render();return;}
  if(a==='valSel'){UI.valSel=b.dataset.id;saveUI();render();return;}
  if(a==='thread'){UI.thread=b.dataset.id;saveUI();render();return;}
  if(a==='val'){const k=b.dataset.id+':'+b.dataset.who;A.val[k]=b.dataset.st;save();render();const c=allComm().find(x=>x.id===b.dataset.id);const n=b.dataset.who==='me'?(appUser()||'Participantul'):b.dataset.who;
    toast(b.dataset.st==='ok'?`${n} a primit +${c.pts} puncte în aplicație.`:b.dataset.st==='no'?`Prezența lui ${n} nu a fost confirmată.`:'Validare anulată.',b.dataset.st==='ok'?'check_circle':'info');return;}
  if(a==='okAll'){const c=allComm().find(x=>x.id===b.dataset.id);people(c).filter(x=>x.st==='pending').forEach(x=>A.val[c.id+':'+x.key]='ok');save();render();toast(`Toți participanții au primit +${c.pts} puncte.`);return;}
  if(a==='scan'){toast('Prototip: aici s-ar deschide camera pentru scanarea codului QR.','qr_code_scanner');return;}
  if(a==='reply'){toast('Prototip: aici ai scrie răspunsul, vizibil sub recenzie în aplicație.','reply');return;}
  if(a==='pause'){const id=b.dataset.id;if(A.paused[id])delete A.paused[id];else A.paused[id]=true;save();render();toast(A.paused[id]?'Oferta e pe pauză și nu mai apare în aplicație.':'Oferta e din nou activă în aplicație.',A.paused[id]?'pause_circle':'play_circle');return;}
  if(a==='volEdit'){go('volEdit',{editId:b.dataset.id});return;}
  if(a==='volToggle'){const v=A.volunteers.find(x=>x.id===b.dataset.id);v.active=!v.active;save();render();toast(v.active?`${v.name} poate scana din nou.`:`Contul lui ${v.name} e suspendat.`,'badge');return;}
  if(a==='firmToggle'){const f=A.firms.find(x=>x.id===b.dataset.id);f.active=!f.active;save();render();toast(f.active?`${f.name} e din nou activă.`:`Contul ${f.name} e suspendat. Ofertele nu mai apar în aplicație.`,'storefront');return;}
  if(a==='impersonate'){UI.acct='firm';UI.firm=b.dataset.id;UI.view='dash';UI.flash=null;saveUI();render();toast('Ești în contul firmei. Revii din „Schimbă contul”.','login');return;}
  if(a==='quick'){sendMsg(b.dataset.v);return;}
  if(a==='del'){const list=b.dataset.list;const it=A[list].find(x=>x.id===b.dataset.id);if(!it||!confirm(`Ștergi „${it.title}”? Dispare și din aplicație.`))return;A[list]=A[list].filter(x=>x.id!==it.id);save();render();toast('Șters din aplicație.','delete');return;}});
function sendMsg(text){const t=(text||'').trim();const v=A.volunteers.find(x=>x.id===UI.thread)||A.volunteers[0];if(!t||!v)return;if(!A.messages.some(m=>m.vol===v.id))A.messages.push({id:'m0'+v.id,vol:v.id,from:'adm',text:SEED_MSG(v.name),ts:Date.now()-3600000});
  A.messages.push({id:uid('m'),vol:v.id,from:'adm',text:t,ts:Date.now()});UI.read[v.id]=Date.now();save();saveUI();render();const i=document.getElementById('cmp-in');if(i)i.focus();}
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;renderBody();return;}const k=e.target.dataset&&e.target.dataset.k;if(!k||!draft)return;draft[k]=e.target.value;if(k===titleKey(UI.view)){e.target.classList.remove('err');const et=document.getElementById('e-title');if(et)et.hidden=true;}upPreview();});
document.addEventListener('change',e=>{if(e.target.id==='f-img'&&e.target.files&&e.target.files[0]){resizeImg(e.target.files[0]).then(u=>{draft.img=u;render();}).catch(()=>toast('Nu am putut citi poza. Încearcă un JPG sau PNG.','error'));return;}const k=e.target.dataset&&e.target.dataset.k;if(k&&draft){draft[k]=e.target.value;upPreview();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){const q=document.getElementById('q');if(q){e.preventDefault();q.focus();}}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='cmp'){const i=document.getElementById('cmp-in');sendMsg(i.value);return;}if(e.target.id!=='frm')return;
  const F=FORMS[UI.view],tk=titleKey(UI.view);if(!draft||String(draft[tk]||'').trim().length<3){const t=document.getElementById('f-title');t.classList.add('err');document.getElementById('e-title').hidden=false;t.focus();return;}
  const name=String(draft[tk]).trim();const [next,flash,extra]=F.save(draft);save();draft=null;go(next,Object.assign({flash:flash||null},extra||{}));
  if(UI.saved){toast(`Am salvat acțiunile lui ${name}. Le vede imediat în aplicație.`);UI.saved=null;saveUI();}else if(!flash)toast(`„${name}” e publicat. Apare acum în aplicație.`);});
render();
})();
</script>
</body>
</html>
