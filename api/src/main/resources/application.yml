server:
  port: ${PORT:8080}

spring:
  application:
    name: aradexperience-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aradexperience}
    username: ${POSTGRES_USER:arad}
    password: ${POSTGRES_PASSWORD:arad}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema vine DOAR din Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  events:
    hot-participants: 50
    hot-saves: 20

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    ro.aradexperience: INFO
